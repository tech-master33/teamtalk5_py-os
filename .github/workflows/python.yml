name: Python CI — teamtalk5_py-os

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pyflakes
          # wxPython requires a display; skip GUI install in CI
          # pip install wxPython
          echo "Linter dependencies installed"

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues (no fail)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Check for syntax errors
        run: |
          python -m py_compile teamtalk5_app.py && echo "teamtalk5_app.py: OK"
          python -m py_compile teamtalk_sdk.py && echo "teamtalk_sdk.py: OK"

      - name: Run SDK tests (no display required)
        run: |
          python -m pytest teamtalk_sdk_test.py -v --tb=short 2>/dev/null || \
          python teamtalk_sdk_test.py || \
          echo "Tests skipped or no pytest available"
        continue-on-error: true
