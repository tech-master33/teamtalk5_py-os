# TeamTalk SDK Configuration File
# This file contains settings for TeamTalk SDK integration

[SDK]
# Path to TeamTalk library
lib_path = ./lib
lib_name = TeamTalk5

# Supported platforms: windows, linux, macos
platform = auto

[Connection]
# Default server settings
default_host = localhost
default_port = 10333
connection_timeout = 30
reconnect_attempts = 3
reconnect_interval = 5

[Audio]
# Audio codec: speex, opus, none
codec = opus
bitrate = 16000
sample_rate = 16000
channels = 1

[Logging]
# Enable debug logging
debug = true
log_level = INFO
log_file = teamtalk.log

[Performance]
# Event poll interval in milliseconds
event_poll_interval = 500
message_buffer_size = 1000
